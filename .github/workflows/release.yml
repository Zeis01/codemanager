# Buduje CodeManager i publikuje wydanie na GitHub po wypchnięciu tagu, np.:
#   npm version 1.2.1 && git push --follow-tags
name: Wydanie

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Zbuduj i opublikuj (instalator, portable, zip + latest.yml)
        run: npx electron-builder --win nsis portable zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
