# Buduje CodeManager i publikuje wydanie na GitHub po wypchnięciu tagu, np.:
#   npm version 1.4.1 && git push --follow-tags
name: Wydanie
run-name: CodeManager ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sprawdź zgodność tagu z wersją w package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nie pasuje do wersji ${PKG} w package.json. Usuń tag i utwórz go na właściwym commicie."
            exit 1
          fi

      - name: Opis wydania z opisu commita
        run: git log -1 --format=%b > release-notes.md

      - run: npm ci
      - run: npm test

      - name: Zbuduj i opublikuj (instalator, portable, zip + latest.yml)
        run: |
          NAME=$(node -p "'CodeManager ' + require('./package.json').version.replace(/-(\\d+)$/, '.\$1')")
          npx electron-builder --win nsis portable zip --publish always -c.releaseInfo.releaseNotesFile=release-notes.md -c.releaseInfo.releaseName="$NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
